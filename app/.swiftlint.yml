# SwiftLint rules for the BrewUpdates app (run by the pre-commit hook)
included:
  - BrewUpdates
  - BrewUpdatesTests

disabled_rules:
  # Logs can contain invalid UTF-8; lossy String(decoding:as:) is intended there
  - optional_data_string_conversion

opt_in_rules:
  - empty_count
  - first_where
  - sorted_first_last
  - toggle_bool
  - unused_optional_binding
  - vertical_whitespace_closing_braces

line_length:
  warning: 140
  error: 180
  ignores_urls: true

type_body_length:
  warning: 300

file_length:
  warning: 400

identifier_name:
  # `to` mirrors the run summary JSON field name
  excluded: [id, ok, to]

nesting:
  type_level: 3
